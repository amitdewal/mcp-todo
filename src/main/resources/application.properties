spring.application.name=todo-mcp-service

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

# MCP Server Configuration (SSE Transport)
spring.ai.mcp.server.name=todo-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.transport=sse
# Print incoming HTTP requests and controllers in Spring Web
logging.level.org.springframework.web=DEBUG

# Trace Spring AI chat calls, prompts, and model interactions
logging.level.org.springframework.ai.chat=DEBUG
logging.level.org.springframework.ai.openai=DEBUG

# Trace MCP tool execution and callbacks
logging.level.org.springframework.ai.tool=DEBUG
logging.level.org.springframework.ai.mcp=DEBUG

# Trace your own application package
logging.level.com.ad.mcp=DEBUG